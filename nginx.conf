events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Protocolo office-health/1 para Front-end estático
        location = /.well-known/office-health {
            default_type application/json;
            add_header Cache-Control "public, max-age=300";
            return 200 '{"protocol":"office-health/1","name":"Merenda Flow Frontend","kind":"web","endpoints":{"liveness":"/healthz","version":"/version.json"},"performance":[{"path":"/"}],"related":["https://api.merenda.portaleducampina.com.br"]}';
        }

        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 'healthy';
        }

        location = /version.json {
            add_header Cache-Control "no-store";
            try_files /version.json =404;
        }

        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}